<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Old Africa Adventures</title>
  <meta name="description"
    content="Real photos and videos from Old Africa Adventures clients — safari game drives, camp life and the moments that made their trips memorable.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="gallery">

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero hero-small" style="background-image:url('assets/gallery/Safari/20260410_184031.jpg');">
      <div class="hero-inner">
        <p class="hero-eyebrow">MOMENTS FROM THE ROAD</p>
        <h1>Gallery</h1>
        <p class="hero-sub">Real photos and videos from our clients' trips — no stock photography, just the
          moments they actually experienced.</p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="filters" data-controls="galleryGrid" id="galleryFilters" style="display:none;"></div>

        <div class="gallery-grid" id="galleryGrid"></div>

        <p id="galleryEmpty" class="text-center" style="display:none; color:var(--ink-500); padding:40px 0;">
          No photos in this category yet.</p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
    <div class="lightbox-media" id="lightboxMedia"></div>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/gallery-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>

</html>
