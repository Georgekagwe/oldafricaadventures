<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Article — Old Africa Adventures</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>

<body data-page="blog">

  <header class="site-header" id="site-header"></header>

  <main id="articlePage" style="display:none;">
    <div class="container breadcrumb">
      <a href="index.html">Home</a> / <a href="blog.html">Blog</a> / <span id="crumbCategory">Article</span>
    </div>

    <section style="padding:10px 0 60px;">
      <div class="container">
        <p class="section-eyebrow" id="articleMeta"></p>
        <h1 style="max-width:24ch; margin-bottom:24px;" id="articleTitle"></h1>

        <div class="article-layout">
          <div class="article-body" id="articleBody"></div>

          <aside>
            <div class="sidebar-block">
              <h5>Related Articles</h5>
              <div id="relatedArticles"></div>
            </div>
            <div class="sidebar-block">
              <h5>Categories</h5>
              <ul class="cat-list" id="categoryList"></ul>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <section id="articleNotFound" style="display:none;">
    <div class="container text-center">
      <h2>Article not found</h2>
      <p>We couldn't find that article. Have a look at everything we've written instead.</p>
      <a href="blog.html" class="btn btn-clay">View All Articles</a>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/blog-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/blog-article.js"></script>
</body>

</html>
